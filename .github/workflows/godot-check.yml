name: Godot Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Install Godot 4.7.1 export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q Godot_v4.7.1-stable_export_templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
      - name: Import project
        run: godot --headless --editor --quit --path .
      - name: Validate project and scripts
        run: godot --headless --path . --quit-after 2
      - name: Validate Windows demo export
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Windows Desktop" build/DarkCarnival.exe
          test -s build/DarkCarnival.exe
          test -s build/DarkCarnival.pck
